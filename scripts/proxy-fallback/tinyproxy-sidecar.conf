# Локальный маршрутизатор трафика на московском VPS.
# Смысл: api.telegram.org -> через зарубежный upstream, остальное -> напрямую.
User nobody
Group nogroup
Port 8888
Timeout 600
LogLevel Warning

# Принимаем только из docker-сети стенда
Allow 172.16.0.0/12
Allow 127.0.0.1

# ── Маршрутизация ──
# Порядок правил важен: tinyproxy берёт ПЕРВОЕ совпадение.
# Telegram — через заграницу:
upstream http __UPSTREAM_PROXY__ "api.telegram.org"
# Всё остальное (в т.ч. LLM) — напрямую, без прокси:
upstream none "."

# CONNECT нужен для HTTPS
ConnectPort 443
ConnectPort 563

DisableViaHeader Yes
